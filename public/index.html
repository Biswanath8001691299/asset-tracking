<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">₹</span>
      <div>
        <h1>Asset Tracker</h1>
        <p class="muted small" id="updated">Loading live prices…</p>
      </div>
    </div>
    <button id="refreshBtn" class="btn ghost" title="Fetch latest market prices">↻ Refresh<span class="wide"> prices</span></button>
  </header>

  <main>
    <div id="alerts"></div>

    <section class="cards" id="summaryCards"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Allocation</h2>
        <span class="muted small" id="goldRate"></span>
      </div>
      <div class="alloc" id="allocBar"></div>
      <div class="legend" id="allocLegend"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Portfolio value over time</h2><span class="muted small">recorded on every price refresh</span></div>
      <div id="historyChart" class="chart"></div>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="stock" role="tab">Indian stocks</button>
        <button class="tab" data-tab="crypto" role="tab">Crypto</button>
        <button class="tab" data-tab="gold" role="tab">Gold SIP</button>
        <span class="spacer"></span>
        <button class="btn primary" id="addBtn">+ Add</button>
      </div>
      <div id="tableWrap" class="table-wrap"></div>
    </section>
  </main>

  <dialog id="dialog">
    <form id="form" method="dialog" autocomplete="off">
      <h3 id="formTitle"></h3>
      <div id="formBody"></div>
      <p class="preview" id="preview"></p>
      <p class="error" id="formError"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
